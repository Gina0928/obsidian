# db-cli 连接注册表 —— 唯一的连接信息真源
#
# 权限要求：chmod 600（含生产库凭据）
# 改密码只改这里；各 AI 工具的 mcp.json 不再承载数据库连接。
#
# 2026-09-08 依据《销领开发使用手册》+ information_schema 实测校准：
#   - 新增 yas-scm-new（此前缺失）
#   - 各实例 databases 字段改为实测真实库名列表
#   - note 补充官方实例名（mysql-xxx）
#
# 字段说明
#   env       环境分组：yas=雅斯 / wky=万客缘 / hmt=好码特 / test=测试
#   engine    mysql | hive | presto | es
#   databases 该实例上实测存在的业务库（information_schema.schemata 实测）
#   readonly  true 时脚本强制拦截一切非 SELECT 语句
#
# 寻址方式（三选一）
#   环境/库    yas/jy_order
#   库名       jy_order        （命中多个环境时列出候选，不猜）
#   实例名     yas-order

