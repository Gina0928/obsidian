# 规约元数据（与「机检规则」无关，仅描述 rules/data/*.md 这套规约原文的适用范围与审查维度）
#
# applies_to：规约适用的语言（小写枚举值见 CodeLanguage）。
#   - 留空/缺省 = 通用规约，任何语言都注入；
#   - 填 [java]  = 只有 diff 涉及 Java 时才注入规约做语义审查。
#
# chapter_dimensions：每个章节的**审查重点**（自由文本，用规约自己的说法）。
#   步骤 2 按章节并发：一个章节 = 一个并发节点，该章规约**只注入这一次**，
#   提示词里的「审查重点」取自这里，避免每章都把六个维度全念一遍导致 LLM 跑偏。
#   - 未在这里声明的章节 = 不限制维度（六个维度全审）；
#   - 这是「重点」而非硬约束：该章节点仍可报出其它维度的问题（由汇总节点去重），
#     否则「性能」这类没有专属章节的维度就没人审了。
#
# ⚠️ 不要再加「维度 → 章节」的反向映射：维度与章节是多对多，按维度扇出会把
#    同一章规约重复注入多次（实测 13 个调用单元 / 42K 字符 vs 6 个单元 / 12.9K 字符）。
#
# 勘码**没有任何正则机检规则**，全部问题由 LLM 按本目录规约逐章语义审查得出。
applies_to: [java]

chapter_dimensions:
  # 各章侧重点不同；数据库与设计规约同时承担「性能」维度
  01-coding-standards: [java代码规范]
  02-exception-logging: [异常日志规范]
  03-security-standards: [系统安规范]
  04-mysql-database: [数据库规范, 性能]
  05-project-structure: [工程结构规范]
  06-design-standards: [系统设计规范, 性能]
